# Compose for the Hostinger-managed "alpha-swarm" project (VPS /docker/alpha-swarm).
#
# Two deliberate differences from docker-compose.prod.yml:
#   - no `env_file: .env`  — the panel injects the project environment itself,
#     and a missing .env on the host makes `compose up` abort before any
#     container is created.
#   - no `container_name`  — avoids a name conflict with any stale container
#     left over from an earlier `docker run`.
services:
  alpha-swarm:
    image: ghcr.io/mo-101/swarm-signal-stream:latest
    restart: always
    pull_policy: always
    stop_grace_period: 20s
    ports:
      - "8085:8080" # dashboard
      - "8090:8090" # runner health endpoint
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - HEALTH_PORT=8090
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
