name: Publish runner Docker image

on:
  push:
    branches: [main]
    paths:
      - "runner/**"
      - "src/**"
      - "Dockerfile.runner"
      - ".github/workflows/docker-publish-runner.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/mo-101/swarm-signal-stream-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
