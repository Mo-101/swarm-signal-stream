# Runner-only container (dashboard runs elsewhere).
#
#   docker compose -f docker-compose.runner.yml up -d --build
#   docker compose -f docker-compose.runner.yml logs -f
#   tail -f logs/runner.log
#
# Runner logs go to stdout AND /app/logs/runner.log (rotated at 20 MB,
# one generation kept), bind-mounted to ./logs on the host so they survive
# container replacement.
services:
  alpha-swarm-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: alpha-swarm-runner:latest
    container_name: alpha-swarm-runner
    restart: always
    ports:
      - "8090:8090"
    env_file:
      - runner/.env
    environment:
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
