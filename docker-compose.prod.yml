# Pull-based VPS deploy — no build on the server.
# Images are published by GitHub Actions on every push to main:
#   ghcr.io/mo-101/swarm-signal-stream:latest         (dashboard + runner)
#   ghcr.io/mo-101/swarm-signal-stream-runner:latest  (runner only)
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  alpha-swarm:
    image: ghcr.io/mo-101/swarm-signal-stream:latest
    container_name: alpha-swarm
    restart: always
    pull_policy: always
    stop_grace_period: 20s
    labels:
      # opt this container (and only this one) into the auto-update watcher
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8085:8080" # dashboard
      - "8090:8090" # runner health endpoint
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - HEALTH_PORT=8090
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Auto-pull watcher: polls GHCR every 5 min and replaces alpha-swarm when a
  # new :latest digest is published by CI. Pinned tag so the updater itself
  # never changes under you. Pause with: docker compose stop watchtower
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: alpha-swarm-watchtower
    restart: always
    command: --label-enable --cleanup --include-restarting --interval 300
    environment:
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_TIMEOUT=30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # reuse the host's existing GHCR login for the private package
      - ~/.docker/config.json:/config.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
